<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CollaboraSync User Workflows</text>
  
  <!-- User Registration and Authentication Workflow -->
  <rect x="50" y="70" width="800" height="150" rx="10" ry="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="450" y="90" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">User Registration and Authentication</text>
  
  <!-- Registration Steps -->
  <rect x="70" y="110" width="120" height="40" rx="5" ry="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
  <text x="130" y="135" font-family="Arial" font-size="14" text-anchor="middle">User Registration</text>
  
  <rect x="240" y="110" width="120" height="40" rx="5" ry="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
  <text x="300" y="135" font-family="Arial" font-size="14" text-anchor="middle">Admin Verification</text>
  
  <rect x="410" y="110" width="120" height="40" rx="5" ry="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
  <text x="470" y="135" font-family="Arial" font-size="14" text-anchor="middle">User Login</text>
  
  <rect x="580" y="110" width="120" height="40" rx="5" ry="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
  <text x="640" y="135" font-family="Arial" font-size="14" text-anchor="middle">Access Dashboard</text>
  
  <!-- User Profile -->
  <rect x="410" y="160" width="120" height="40" rx="5" ry="5" fill="#90caf9" stroke="#1565c0" stroke-width="1" />
  <text x="470" y="185" font-family="Arial" font-size="14" text-anchor="middle">Profile Management</text>
  
  <!-- Arrows -->
  <line x1="190" y1="130" x2="240" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="360" y1="130" x2="410" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="530" y1="130" x2="580" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="470" y1="150" x2="470" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Project Management Workflow -->
  <rect x="50" y="240" width="800" height="150" rx="10" ry="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="450" y="260" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Project Management Workflow</text>
  
  <!-- Project Steps -->
  <rect x="70" y="280" width="140" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" />
  <text x="140" y="305" font-family="Arial" font-size="14" text-anchor="middle">Create Project</text>
  
  <rect x="260" y="280" width="140" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" />
  <text x="330" y="305" font-family="Arial" font-size="14" text-anchor="middle">Add Team Members</text>
  
  <rect x="450" y="280" width="140" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" />
  <text x="520" y="305" font-family="Arial" font-size="14" text-anchor="middle">Create Tasks</text>
  
  <rect x="640" y="280" width="140" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" />
  <text x="710" y="305" font-family="Arial" font-size="14" text-anchor="middle">Monitor Progress</text>
  
  <!-- Project Actions -->
  <rect x="160" y="330" width="120" height="40" rx="5" ry="5" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" />
  <text x="220" y="355" font-family="Arial" font-size="14" text-anchor="middle">Set Deadlines</text>
  
  <rect x="390" y="330" width="120" height="40" rx="5" ry="5" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" />
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle">Assign Tasks</text>
  
  <rect x="620" y="330" width="120" height="40" rx="5" ry="5" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" />
  <text x="680" y="355" font-family="Arial" font-size="14" text-anchor="middle">Generate Reports</text>
  
  <!-- Arrows -->
  <line x1="210" y1="300" x2="260" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="400" y1="300" x2="450" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="590" y1="300" x2="640" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="140" y1="320" x2="180" y2="330" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="320" x2="450" y2="330" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="710" y1="320" x2="680" y2="330" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Task Management Workflow -->
  <rect x="50" y="410" width="800" height="170" rx="10" ry="10" fill="#fff8e1" stroke="#ff8f00" stroke-width="2" />
  <text x="450" y="430" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Task Management Workflow (Kanban)</text>
  
  <!-- Kanban Board -->
  <rect x="70" y="450" width="150" height="110" rx="5" ry="5" fill="#ffecb3" stroke="#ff8f00" stroke-width="1" />
  <text x="145" y="470" font-family="Arial" font-size="14" text-anchor="middle">To Do</text>
  <rect x="90" y="480" width="110" height="30" rx="3" ry="3" fill="#fff" stroke="#ff8f00" stroke-width="1" />
  <text x="145" y="500" font-family="Arial" font-size="12" text-anchor="middle">Task 1</text>
  <rect x="90" y="520" width="110" height="30" rx="3" ry="3" fill="#fff" stroke="#ff8f00" stroke-width="1" />
  <text x="145" y="540" font-family="Arial" font-size="12" text-anchor="middle">Task 2</text>
  
  <rect x="270" y="450" width="150" height="110" rx="5" ry="5" fill="#ffecb3" stroke="#ff8f00" stroke-width="1" />
  <text x="345" y="470" font-family="Arial" font-size="14" text-anchor="middle">In Progress</text>
  <rect x="290" y="480" width="110" height="30" rx="3" ry="3" fill="#fff" stroke="#ff8f00" stroke-width="1" />
  <text x="345" y="500" font-family="Arial" font-size="12" text-anchor="middle">Task 3</text>
  
  <rect x="470" y="450" width="150" height="110" rx="5" ry="5" fill="#ffecb3" stroke="#ff8f00" stroke-width="1" />
  <text x="545" y="470" font-family="Arial" font-size="14" text-anchor="middle">Under Review</text>
  <rect x="490" y="480" width="110" height="30" rx="3" ry="3" fill="#fff" stroke="#ff8f00" stroke-width="1" />
  <text x="545" y="500" font-family="Arial" font-size="12" text-anchor="middle">Task 4</text>
  
  <rect x="670" y="450" width="150" height="110" rx="5" ry="5" fill="#ffecb3" stroke="#ff8f00" stroke-width="1" />
  <text x="745" y="470" font-family="Arial" font-size="14" text-anchor="middle">Completed</text>
  <rect x="690" y="480" width="110" height="30" rx="3" ry="3" fill="#fff" stroke="#ff8f00" stroke-width="1" />
  <text x="745" y="500" font-family="Arial" font-size="12" text-anchor="middle">Task 5</text>
  
  <!-- Kanban Movement -->
  <path d="M 200,500 C 220,500 250,500 270,500" stroke="#ff8f00" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 400,500 C 420,500 450,500 470,500" stroke="#ff8f00" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 600,500 C 620,500 650,500 670,500" stroke="#ff8f00" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Notification Indicators -->
  <circle cx="530" y="130" r="5" fill="#f44336" />
  <circle cx="590" y="300" r="5" fill="#f44336" />
  <circle cx="600" y="500" r="5" fill="#f44336" />
  
  <!-- Legend -->
  <rect x="50" y="580" width="15" height="15" rx="7.5" ry="7.5" fill="#f44336" />
  <text x="75" y="593" font-family="Arial" font-size="12" text-anchor="start">Real-time Notifications</text>
  
</svg>